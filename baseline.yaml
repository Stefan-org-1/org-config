# Applied to every repo. Repos add rule sets on top; they cannot remove these.
merge: [platform-integrity]
deploy:
  all: [platform-integrity, central-deploy, green-pipeline]
  prod: [deploy-window]

# Approvals an emergency change request needs to override rule sets marked break_glass: true.
# How long it lasts is its window, at most 24 hours (checked in change-requests).
break_glass:
  slots:
    - ["sentinels-{team}"]
    - ["managers-{team}"]
