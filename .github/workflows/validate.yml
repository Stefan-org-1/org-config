name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Stefan-org-1/org-policy
          path: org-policy
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Stefan-org-1/platform-gate
          path: platform-gate
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pyyaml==6.0.2
      - run: python validate.py . org-policy
        env:
          GH_TOKEN: ${{ github.token }}
      # The gate's own loader, so the manifest can never name something the gate cannot run.
      - working-directory: platform-gate
        run: python -m gate --org "$GITHUB_REPOSITORY_OWNER" --check --manifest-dir .. --policy-dir ../org-policy
