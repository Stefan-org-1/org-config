team: team-platform
lead: StefanPanait
channel: "#platform"
repos:
  - name: ci-templates
    description: Reusable workflows called by every app repo
    tier: critical
    shape: library
    status: active
  - name: org-manifest
    description: Approved repos, teams and members. Teams edit their own file
    tier: critical
    shape: config
    status: active
    code_owner_review: true
    required_checks: [validate]
    shared: true
  - name: org-policy
    description: Rule sets, baseline and break-glass the deploy gate applies
    tier: critical
    shape: config
    status: active
    code_owner_review: true
  - name: org-terraform
    description: Applies org-manifest and org-policy to GitHub
    tier: critical
    shape: service
    status: active
    code_owner_review: true
  - name: change-requests
    description: "Deploy change requests: version, environments, window and approvers"
    tier: critical
    shape: config
    status: active
    shared: true
  - name: platform-gate
    description: Posts merge checks and answers deploys as the platform App
    tier: critical
    shape: service
    status: active
  - name: .github
    description: Org front page and system overview
    tier: internal
    shape: docs
    status: active
