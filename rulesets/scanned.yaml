description: The commit was scanned by the central scan template, as shown by its signed result.
rules:
  - attested:
      # node-build.yml is deprecated. Drop it once every repo calls scan.yml.
      signer_workflows:
        - Stefan-org-1/ci-templates/.github/workflows/scan.yml
        - Stefan-org-1/ci-templates/.github/workflows/node-build.yml
      predicate_type: https://github.com/Stefan-org-1/ci-templates/scan/v1
      require:
        secret_scan: pass
